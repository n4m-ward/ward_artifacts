name: ci

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - deploy
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, intl, sqlite3, pdo_sqlite
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dependências
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Ambiente
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan passport:keys --no-interaction

      - name: Assets
        run: npm run build

      - name: Estilo (Pint)
        run: vendor/bin/pint --test

      - name: Testes
        run: php artisan test
