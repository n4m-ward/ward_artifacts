<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nome da página</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
  <style>
    :root { --bg: #0E0E0E; --ink: #E5E5E5; --muted: #A3A3A3; --line: #262626; --accent: #38BDF8; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans", system-ui, sans-serif; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    h1 { font-family: "Space Grotesk", sans-serif; font-size: clamp(40px, 5vw, 64px); letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <header class="wrap" style="padding-block: 20px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px">
    <strong>Marca</strong>
    <nav style="display: flex; gap: 24px"><a href="#" style="color: var(--muted)">Link</a></nav>
  </header>
  <main class="wrap" style="padding-block: 80px">
    <h1>Título da página</h1>
  </main>
</body>
</html>
