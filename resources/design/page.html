<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nome da página</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- O par de fontes da direção do design (o mesmo em todos os artboards). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=FONTE+DISPLAY&family=FONTE+TEXTO:wght@400;500;600;700&display=swap">
  <style>
    /* Tokens da direção: os mesmos valores em todos os artboards do design.
       Escolha-os para este produto; não há paleta padrão. */
    :root {
      --bg: oklch(L C H);
      --ink: oklch(L C H);
      --muted: oklch(L C H);
      --line: oklch(L C H);
      --accent: oklch(L C H);
      --display: "Fonte display", serif;
      --text: "Fonte texto", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--text); line-height: 1.5; }
    img { display: block; max-width: 100%; }
    /* Raiz fluida: largura máxima e margens, nunca largura fixa. */
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 48px); }
    h1, h2 { font-family: var(--display); font-weight: 400; text-wrap: balance; margin: 0; }
    h1 { font-size: clamp(44px, 6vw, 88px); line-height: 1; letter-spacing: -0.02em; }
  </style>
</head>
<body>
  <header class="wrap"><!-- Marca, navegação, ação principal. --></header>
  <main>
    <section class="wrap"><!-- Hero com a mensagem principal. --></section>
    <!-- Seções completas: prova, recursos, preços, perguntas, rodapé. -->
  </main>
</body>
</html>
