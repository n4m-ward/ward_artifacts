<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Nome da tela</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
  <style>
    :root { --bg: #0E0E0E; --ink: #F5F5F5; --muted: #A3A3A3; --line: #262626; --accent: #38BDF8; }
    body { margin: 0; }
    .board {
      width: 1080px; height: 1080px; overflow: hidden; box-sizing: border-box;
      background: var(--bg); color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      padding: 88px; display: flex; flex-direction: column; justify-content: space-between;
    }
    h1 { margin: 0; font-family: "Space Grotesk", sans-serif; font-size: 120px; line-height: 1; letter-spacing: -0.04em; }
  </style>
</head>
<body>
  <div class="board">
    <h1>Título</h1>
    <p style="margin: 0; font-size: 32px; color: var(--muted)">Uma frase de apoio.</p>
  </div>
</body>
</html>
