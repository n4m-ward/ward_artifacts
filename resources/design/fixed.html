<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Nome da tela</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- O par de fontes da direção do design (o mesmo em todos os artboards). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=FONTE+DISPLAY&family=FONTE+TEXTO:wght@400;500;600;700&display=swap">
  <style>
    /* Tokens da direção: os mesmos valores em todos os artboards do design.
       Escolha-os para este produto; não há paleta padrão. */
    :root {
      --bg: oklch(L C H);      /* fundo */
      --ink: oklch(L C H);     /* texto principal */
      --muted: oklch(L C H);   /* texto secundário */
      --line: oklch(L C H);    /* divisórias */
      --accent: oklch(L C H);  /* ação e destaque */
      --display: "Fonte display", serif;
      --text: "Fonte texto", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    img { display: block; width: 100%; height: 100%; object-fit: cover; }
    /* Raiz com o tamanho exato do artboard (aqui, um celular 390×844). */
    .board {
      width: 390px; height: 844px; overflow: hidden; position: relative;
      background: var(--bg); color: var(--ink);
      font-family: var(--text); font-size: 15px; line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    h1 { margin: 0; font-family: var(--display); font-weight: 400; text-wrap: balance; }
  </style>
</head>
<body>
  <main class="board">
    <!-- Barra de status, navegação, conteúdo real da tela, ações. -->
  </main>
</body>
</html>
